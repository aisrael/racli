syntax = "proto3";
package racli;

// gRPC API exposed by `racli server` on the Unix socket.
service Racli {
  // Returns the running server's version string (crate / binary version).
  rpc GetVersion (GetVersionRequest) returns (GetVersionResponse);
  // Runs LSP `workspace/symbol` via rust-analyzer and returns a structured response.
  rpc Search (SearchRequest) returns (SearchResponse);
  // Runs LSP `textDocument/definition` at a path and LSP position (0-based line/character).
  rpc FindDefinition (FindDefinitionRequest) returns (FindDefinitionResponse);
  // Runs LSP `textDocument/references` at a path and LSP position (0-based line/character); the server always includes the declaration.
  rpc FindReferences (FindReferencesRequest) returns (FindReferencesResponse);
  // Runs LSP `textDocument/implementation` at a path and LSP position (0-based line/character).
  rpc FindImplementations (FindImplementationsRequest) returns (FindImplementationsResponse);
  // Runs LSP `textDocument/prepareCallHierarchy` at a path and LSP position (0-based line/character).
  rpc PrepareCallHierarchy (PrepareCallHierarchyRequest) returns (PrepareCallHierarchyResponse);
  // Runs LSP `callHierarchy/incomingCalls` for a call hierarchy item (callers of the item).
  rpc IncomingCalls (CallHierarchyCallsRequest) returns (IncomingCallsResponse);
  // Runs LSP `callHierarchy/outgoingCalls` for a call hierarchy item (callees of the item).
  rpc OutgoingCalls (CallHierarchyCallsRequest) returns (OutgoingCallsResponse);
  // Runs LSP `textDocument/documentSymbol` for a single file (no line/character).
  rpc DocumentSymbols (DocumentSymbolsRequest) returns (DocumentSymbolsResponse);
  // Returns the cached LSP `InitializeResult` racli received from rust-analyzer (as JSON).
  rpc LspInitialize (LspInitializeRequest) returns (LspInitializeResponse);
  // Forwards an arbitrary LSP request to rust-analyzer (`initialize` and `shutdown` are rejected).
  rpc LspRequest (LspRequestRequest) returns (LspRequestResponse);
  // Forwards an arbitrary LSP notification to rust-analyzer (`initialized` and `exit` are rejected).
  rpc LspNotify (LspNotifyRequest) returns (LspNotifyResponse);
  // Streams server-to-client LSP notifications (latest diagnostics per document are replayed first).
  rpc LspEvents (LspEventsRequest) returns (stream LspEvent);
}

// Empty request for GetVersion (no parameters).
message GetVersionRequest {}

// LSP `InitializeResult.serverInfo` (language server name and version).
message LspServerInfo {
  string name = 1;
  string version = 2;
}

// Response carrying the server version and the rust-analyzer LSP `serverInfo`.
message GetVersionResponse {
  // Semantic version string (e.g. from Cargo.toml).
  string version = 1;
  // Name and version reported by rust-analyzer in its `initialize` response (may be empty if missing).
  LspServerInfo lsp_server_info = 2;
}

// An LSP Position
message LspPosition {
  uint32 line = 1;
  uint32 character = 2;
}

// An LSP Range
message LspRange {
  LspPosition start = 1;
  LspPosition end = 2;
}

// LSP `Location`-like entry (uri + range).
message LspLocation {
  string uri = 1;
  LspRange range = 2;
}

// Subset of LSP `WorkspaceSymbol` (location may omit range when only a URI is returned).
message LspWorkspaceSymbol {
  string name = 1;
  string kind = 2;
  string uri = 3;
  optional LspRange range = 4;
}

// Subset of LSP `SymbolInformation` used on the wire.
message LspSymbolInformation {
  string name = 1;
  string kind = 2;
  string uri = 3;
  LspRange range = 4;
}

// Subset of LSP `DocumentSymbol` (hierarchical; `children` recurses for nested symbols, e.g. methods under an `impl`).
message LspDocumentSymbol {
  string name = 1;
  optional string detail = 2;
  string kind = 3;
  LspRange range = 4;
  LspRange selection_range = 5;
  repeated LspDocumentSymbol children = 6;
}

// `WorkspaceSymbolResponse::Flat`: `Vec<SymbolInformation>`.
message LspSymbolInformationList {
  repeated LspSymbolInformation items = 1;
}

// `WorkspaceSymbolResponse::Nested`: `Vec<WorkspaceSymbol>`.
message LspWorkspaceSymbolList {
  repeated LspWorkspaceSymbol items = 1;
}

// Mirrors `lsp_types::WorkspaceSymbolResponse` (flat symbol list vs nested workspace symbols).
message LspWorkspaceSymbolResponse {
  oneof payload {
    LspSymbolInformationList flat = 1;
    LspWorkspaceSymbolList nested = 2;
  }
}

// rust-analyzer `workspace/symbol` `searchKind` extension; unspecified uses rust-analyzer's default (types only).
enum SymbolSearchKind {
  SYMBOL_SEARCH_KIND_UNSPECIFIED = 0;
  SYMBOL_SEARCH_KIND_ONLY_TYPES = 1;
  SYMBOL_SEARCH_KIND_ALL_SYMBOLS = 2;
}

// rust-analyzer `workspace/symbol` `searchScope` extension; unspecified uses rust-analyzer's default (workspace only).
enum SymbolSearchScope {
  SYMBOL_SEARCH_SCOPE_UNSPECIFIED = 0;
  SYMBOL_SEARCH_SCOPE_WORKSPACE = 1;
  SYMBOL_SEARCH_SCOPE_WORKSPACE_AND_DEPENDENCIES = 2;
}

// Parameters for `Racli.Search`.
message SearchRequest {
  string query = 1;
  // Which symbol kinds to return.
  SymbolSearchKind kind = 2;
  // Which crates to search.
  SymbolSearchScope scope = 3;
}

// Result of `Racli.Search` wrapping an LSP-shaped workspace symbol payload.
message SearchResponse {
  LspWorkspaceSymbolResponse workspace_symbol_response = 1;
}

// Parameters for `Racli.FindDefinition` (absolute `file_path` resolved on the server).
message FindDefinitionRequest {
  string file_path = 1;
  uint32 line = 2;
  uint32 character = 3;
}

// Result of `Racli.FindDefinition`: zero or more definition sites (scalar/array/link flattened).
message FindDefinitionResponse {
  repeated LspLocation locations = 1;
}

// Parameters for `Racli.FindReferences` (absolute `file_path` resolved on the server); include_declaration is always true server-side.
message FindReferencesRequest {
  string file_path = 1;
  uint32 line = 2;
  uint32 character = 3;
}

// Result of `Racli.FindReferences`: all reference sites for the symbol (the declaration is always included).
message FindReferencesResponse {
  repeated LspLocation locations = 1;
}

// Parameters for `Racli.FindImplementations` (absolute `file_path` resolved on the server).
message FindImplementationsRequest {
  string file_path = 1;
  uint32 line = 2;
  uint32 character = 3;
}

// Result of `Racli.FindImplementations`: zero or more implementation sites (scalar/array/link flattened).
message FindImplementationsResponse {
  repeated LspLocation locations = 1;
}

// Mirrors `lsp_types::CallHierarchyItem`. Round-trips opaquely through the client: a client must
// hand back the exact item it received from `PrepareCallHierarchy` unmodified when calling
// `IncomingCalls`/`OutgoingCalls`, so `kind` is the raw LSP `SymbolKind` number (not the display
// string used elsewhere) and `data_json` is never interpreted client-side.
message LspCallHierarchyItem {
  string name = 1;
  int32 kind = 2;
  string uri = 3;
  LspRange range = 4;             // whole item (e.g. the function body)
  LspRange selection_range = 5;   // just the name
  optional string detail = 6;
  optional string data_json = 7;  // opaque passthrough, preserved from the LSP `data` field
}

// Parameters for `Racli.PrepareCallHierarchy` (absolute `file_path` resolved on the server).
message PrepareCallHierarchyRequest {
  string file_path = 1;
  uint32 line = 2;
  uint32 character = 3;
}

// Result of `Racli.PrepareCallHierarchy`: zero or more candidate items at the given position.
message PrepareCallHierarchyResponse {
  repeated LspCallHierarchyItem items = 1;
}

// Parameters for `Racli.IncomingCalls`/`Racli.OutgoingCalls`: the exact item from `PrepareCallHierarchy`.
message CallHierarchyCallsRequest {
  LspCallHierarchyItem item = 1;
}

// Mirrors `lsp_types::CallHierarchyIncomingCall`: a caller of the queried item.
message LspCallHierarchyIncomingCall {
  LspCallHierarchyItem from = 1;
  repeated LspRange from_ranges = 2;
}

// Mirrors `lsp_types::CallHierarchyOutgoingCall`: a callee of the queried item.
message LspCallHierarchyOutgoingCall {
  LspCallHierarchyItem to = 1;
  repeated LspRange from_ranges = 2;
}

// Result of `Racli.IncomingCalls`.
message IncomingCallsResponse {
  repeated LspCallHierarchyIncomingCall calls = 1;
}

// Result of `Racli.OutgoingCalls`.
message OutgoingCallsResponse {
  repeated LspCallHierarchyOutgoingCall calls = 1;
}

// Parameters for `Racli.DocumentSymbols` (absolute `file_path` resolved on the server).
message DocumentSymbolsRequest {
  string file_path = 1;
}

// Result of `Racli.DocumentSymbols`: top-level symbols in the file, each possibly with nested children.
message DocumentSymbolsResponse {
  repeated LspDocumentSymbol symbols = 1;
}

// Empty request for `Racli.LspInitialize`.
message LspInitializeRequest {}

// Result of `Racli.LspInitialize`: rust-analyzer's LSP `InitializeResult` as JSON.
message LspInitializeResponse {
  string result_json = 1;
}

// Parameters for `Racli.LspRequest`: LSP method name plus its params as JSON (empty means no params).
message LspRequestRequest {
  string method = 1;
  string params_json = 2;
}

// JSON-RPC `error` object returned by rust-analyzer for an LSP request.
message LspResponseError {
  int32 code = 1;
  string message = 2;
  optional string data_json = 3;
}

// Result of `Racli.LspRequest`: either the JSON `result` or the JSON-RPC `error` from rust-analyzer.
message LspRequestResponse {
  oneof outcome {
    string result_json = 1;
    LspResponseError error = 2;
  }
}

// Parameters for `Racli.LspNotify`: LSP method name plus its params as JSON (empty means no params).
message LspNotifyRequest {
  string method = 1;
  string params_json = 2;
}

// Empty result of `Racli.LspNotify` (sent once the notification has been written to rust-analyzer).
message LspNotifyResponse {}

// Empty request for `Racli.LspEvents`.
message LspEventsRequest {}

// A server-to-client LSP notification (e.g. `textDocument/publishDiagnostics`).
message LspEvent {
  string method = 1;
  string params_json = 2;
}
