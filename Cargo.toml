[package]
name = "racli"
description = "a rust-analyzer client"
version = "0.3.0"
edition = "2024"
default-run = "racli"
build = "build.rs"
repository = "https://github.com/aisrael/racli"
readme = "README.md"
license = "MIT"
exclude = [
    ".github/*"
]

[dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo"] }
jsonrpsee = { version = "0.26.1", features = ["async-client", "client-core"] }
lsp-types = "0.97.0"
notify = { version = "8.0", optional = true }
prost = "0.14.4"
rmcp = "3.5.0"
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream = { version = "0.1.19", features = ["net", "sync"] }
tonic = "0.14"
tonic-prost = "0.14"
url = "2"
ractor = "0.16"
glob = "0.3.4"

[features]
default = []
# racli's own workspace file watcher. Off by default: rust-analyzer watches the workspace itself,
# and the CLI doesn't load notify's macOS frameworks at startup (ADR 005).
notify = ["dep:notify"]

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
criterion = "0.8.2"
cucumber = "0.23.0"
jsonpath-rust = "1"
libc = "0.2"
rmcp = { version = "3.3.0", features = ["client", "transport-child-process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tempfile = "3"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "find_definition"
harness = false

[[bench]]
name = "find_references"
harness = false

[[bench]]
name = "call_hierarchy"
harness = false

[[bench]]
name = "find_implementations"
harness = false

[[bench]]
name = "document_symbols"
harness = false

[[bench]]
name = "tokens"
harness = false

[[test]]
name = "cucumber"
harness = false
