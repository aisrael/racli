[package]
name = "racli"
description = "a rust-analyzer client"
version = "0.2.2"
edition = "2024"
build = "build.rs"
repository = "https://github.com/aisrael/racli"
readme = "README.md"
license = "MIT"
exclude = [
    ".github/*"
]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "cargo"] }
jsonrpsee = { version = "0.26.0", features = ["async-client", "client-core"] }
lsp-types = "0.97.0"
notify = "8.0"
prost = "0.14.4"
rmcp = "3.3.0"
schemars = { version = "1.2.2", features = ["chrono04"] }
serde = "1.0.229"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = "0.14"
tonic-prost = "0.14"
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[build-dependencies]
tonic-prost-build = "0.14"

[dev-dependencies]
criterion = "0.8.2"
cucumber = "0.23.0"
jsonpath-rust = "1"
libc = "0.2"
rmcp = { version = "3.3.0", features = ["client", "transport-child-process"] }
tempfile = "3"

[[bench]]
name = "search"
harness = false

[[bench]]
name = "find_definition"
harness = false

[[test]]
name = "cucumber"
harness = false
